<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Données vérifiées dans MySQL</title>
  <desc id="desc">La salle S1 et la machine M-101 de marque Dell sont présentes et associées.</desc>
  <rect width="1000" height="390" rx="16" fill="#111827"/>
  <rect width="1000" height="48" rx="16" fill="#1f2937"/>
  <circle cx="25" cy="24" r="7" fill="#f87171"/><circle cx="49" cy="24" r="7" fill="#fbbf24"/><circle cx="73" cy="24" r="7" fill="#34d399"/>
  <text x="500" y="30" text-anchor="middle" fill="#d1d5db" font-family="Segoe UI, sans-serif" font-size="15">MySQL — db_tp_hibernate</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <text x="32" y="83" fill="#93c5fd">mysql&gt; SELECT id, code, libelle FROM salles ORDER BY id;</text>
    <text x="32" y="119" fill="#f9fafb">id    code    libelle</text>
    <text x="32" y="148" fill="#d1d5db">1     S2      Salle Réseau</text>
    <text x="32" y="177" fill="#d1d5db">2     S1      Salle Informatique</text>
    <text x="32" y="220" fill="#93c5fd">mysql&gt; SELECT id, ref, marque, salle_id FROM machines ORDER BY id;</text>
    <text x="32" y="256" fill="#f9fafb">id    ref      marque    salle_id</text>
    <text x="32" y="285" fill="#d1d5db">1     M-101    Dell      2</text>
    <text x="32" y="340" fill="#86efac">M-101 est reliée à la salle S1 (id 2).</text>
  </g>
</svg>
